<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | QueueLess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;


    background:
    linear-gradient(
    135deg,
    #ffffff 0%,
    #eef2ff 35%,
    #dbeafe 100%
   );

    position:relative;
    background-attachment:fixed;

}

/* ===========================
   Animated Background
=========================== */

.background{

    position:absolute;
    inset:0;
    overflow:hidden;

}

.circle{

    position:absolute;

    border-radius:50%;

    background:
    rgba(99,102,241,.07);

    animation:float 16s ease-in-out infinite;

    filter:blur(.2px);

}

.circle:nth-child(1){

    width:220px;
    height:220px;

    top:-70px;
    left:-60px;

}

.circle:nth-child(2){

    width:170px;
    height:170px;

    right:-40px;
    top:120px;

    animation-duration:18s;

}

.circle:nth-child(3){

    width:260px;
    height:260px;

    bottom:-120px;
    left:10%;

    animation-duration:20s;

}

.circle:nth-child(4){

    width:110px;
    height:110px;

    right:15%;
    bottom:60px;

    animation-duration:15s;

}

.circle:nth-child(5){

    width:80px;
    height:80px;

    left:50%;
    top:8%;

    animation-duration:12s;

}

@keyframes float{

0%,100%{

transform:translateY(0px) rotate(0deg);

}

50%{

transform:translateY(-35px) rotate(180deg);

}

}

/* ===========================
      Main Container
=========================== */

.container{

    width:100%;
    max-width:470px;

    padding:20px;

    position:relative;

    z-index:2;

}

.card{

    background:rgba(255,255,255,.96);

    border-radius:28px;

    padding:38px 36px;

    border:1px solid rgba(255,255,255,.75);

    box-shadow:

    0 30px 80px rgba(99,102,241,.16),

    0 12px 35px rgba(0,0,0,.08);

    transition:
    transform .35s ease,
    box-shadow .35s ease;

    animation:cardUp .8s ease;

}

.card:hover{

    transform:translateY(-6px);

    box-shadow:

    0 40px 90px rgba(99,102,241,.22),

    0 20px 40px rgba(0,0,0,.10);

}

@keyframes cardUp{

from{

opacity:0;
transform:translateY(35px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ===========================
         Logo
=========================== */

.logo{

display:flex;

justify-content:center;

align-items:center;

gap:14px;

margin-bottom:28px;

}

.logo-icon{

width:60px;
height:60px;

border-radius:18px;

display:flex;
justify-content:center;
align-items:center;

font-size:28px;

font-weight:700;

color:#fff;

position:relative;
overflow:hidden;

background:
linear-gradient(
135deg,
#6366f1,
#4f46e5
);

box-shadow:
0 15px 35px rgba(79,70,229,.35);

}

.logo-icon::before{

content:"";

position:absolute;

top:-40%;

left:-80%;

width:60%;

height:180%;

background:rgba(255,255,255,.35);

transform:rotate(25deg);

animation:shine 4s linear infinite;

}

.logo-text h2{

font-size:32px;

font-weight:700;

color:#111827;

}

.logo-text p{

margin-top:2px;

font-size:13px;

color:#64748b;

}

/* ===========================
      Shield
=========================== */

.shield{

margin:auto;

width:80px;
height:80px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

background:#eef2ff;

color:#4f46e5;

font-size:36px;

margin-bottom:18px;

box-shadow:
0 10px 30px rgba(79,70,229,.18);

animation:pulse 2.2s infinite;

}

@keyframes pulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.07);

}

}

@keyframes shine{

0%{
left:-80%;
}

100%{
left:160%;
}

}

/* ===========================
      Titles
=========================== */

.title{

text-align:center;

font-size:32px;

font-weight:700;

color:#111827;

margin-bottom:10px;

}

.subtitle{

text-align:center;

font-size:14px;

line-height:1.7;

color:#64748b;

margin-bottom:30px;

}
/* ===========================
      Input Field
=========================== */

.input-group{

position:relative;

margin-bottom:22px;

}

.input-group i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#6366f1;

font-size:17px;

transition:.3s;

}

.input-group input{

width:100%;

height:60px;

padding:0 18px 0 52px;

border-radius:16px;

border:1px solid #dbe3f0;

background:#ffffff;

font-size:15px;

font-weight:500;

color:#111827;

outline:none;

transition:.3s;

}

.input-group input::placeholder{

color:#94a3b8;

}

.input-group input:hover{

border-color:#c7d2fe;

}

.input-group input:focus{

border-color:#4f46e5;

background:#ffffff;

box-shadow:
0 0 0 4px rgba(79,70,229,.12);

}

.input-group:focus-within i{

color:#4f46e5;

}


/* ===========================
      Button
=========================== */

button{

width:100%;

height:60px;

border:none;

outline:none;

cursor:pointer;

border-radius:16px;

font-size:16px;

font-weight:600;

color:#fff;

background:
linear-gradient(
135deg,
#6366f1,
#4f46e5
);

box-shadow:
0 15px 30px rgba(79,70,229,.30);

transition:.35s;

}

button:hover{

transform:translateY(-4px) scale(1.02);

box-shadow:
0 20px 40px rgba(79,70,229,.35);

}

button:active{

transform:scale(.98);

}

button:disabled{

cursor:not-allowed;

opacity:.8;

}

button i{

margin-right:8px;

}

/* ===========================
      Messages
=========================== */

.message{

margin-top:18px;

text-align:center;

font-size:14px;

font-weight:500;

min-height:22px;

}

/* ===========================
      Bottom Link
=========================== */

.back{

margin-top:22px;

text-align:center;

}

.back a{

text-decoration:none;

color:#4f46e5;

font-weight:600;

transition:.3s;

}

.back a:hover{

color:#312e81;

}

/* ===========================
      Responsive
=========================== */

@media(max-width:600px){

.container{

padding:18px;

}

.card{

padding:34px 24px;

border-radius:22px;

}

.logo{

flex-direction:column;

gap:10px;

}

.logo-text{

text-align:center;

}

.logo-text h2{

font-size:25px;

}

.title{

font-size:25px;

}

.subtitle{

font-size:13px;

}

}

</style>

</head>

<body>

<div class="background">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

</div>

<div class="container">

<div class="card">

<div class="logo">

<div class="logo-icon">
Q
</div>

<div class="logo-text">

<h2>QueueLess</h2>

<p>Smart Queue Management</p>

</div>

</div>

<div class="shield">

<i class="fa-solid fa-shield-halved"></i>

</div>

<h1 class="title">

Forgot Password

</h1>

<p class="subtitle">

Enter your registered email address.<br>
We'll send a One-Time Password (OTP) to reset your password.

</p>

<div class="input-group">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

Send OTP

</button>

<div
id="message"
class="message">
</div>

<div class="back">

<a href="login.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</div>

</div>

</div>
<script>

const email=document.getElementById("email");
const sendBtn=document.getElementById("sendBtn");
const message=document.getElementById("message");

function showMessage(text,color){

    message.innerHTML=text;
    message.style.color=color;

}

async function sendOTP(){

    if(email.value.trim()===""){

        showMessage(
        "Please enter your registered email.",
        "#ef4444"
        );

        email.focus();

        return;

    }

    sendBtn.disabled=true;

    sendBtn.innerHTML=
    '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

    try{

        const response=await fetch(
        "/api/forgot-password",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                email:email.value.trim().toLowerCase()
            })
        });

        const data=await response.json();

        if(response.ok){

            showMessage(
            data.message || "OTP sent successfully!",
            "#22c55e"
            );

            sessionStorage.setItem(
            "resetEmail",
            email.value.trim().toLowerCase()
            );

            setTimeout(function(){

                window.location.href="verify-otp.html";

            },1000);

        }else{

            showMessage(
            data.message || "Failed to send OTP.",
            "#ef4444"
            );

        }

    }

    catch(error){

        console.error(error);

        showMessage(
        "Unable to connect to server.",
        "#ef4444"
        );

    }

    finally{

        sendBtn.disabled=false;

        sendBtn.innerHTML=
        '<i class="fa-solid fa-paper-plane"></i> Send OTP';

    }

}

sendBtn.addEventListener("click",sendOTP);

email.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        sendOTP();

    }

});

</script>

</body>

</html>
