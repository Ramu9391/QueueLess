<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | QueueLess</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{

background:
radial-gradient(circle at 15% 20%,rgba(37,99,235,.16),transparent 30%),
radial-gradient(circle at 85% 15%,rgba(79,70,229,.14),transparent 30%),
linear-gradient(135deg,#f8fbff,#ffffff);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:40px;

}

        .login-box{

width:460px;

background:rgba(255,255,255,.95);

backdrop-filter:blur(18px);

padding:45px;

border-radius:28px;

box-shadow:
0 25px 60px rgba(37,99,235,.12);

border:1px solid rgba(255,255,255,.4);

animation:fadeUp .8s;

}

.login-box{

transition:.35s;

}

.login-box:hover{

transform:translateY(-8px);

box-shadow:0 35px 70px rgba(37,99,235,.22);

}


@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon{

display:inline-flex;

align-items:center;

justify-content:center;

width:70px;

height:70px;

border-radius:20px;

background:
linear-gradient(135deg,#2563eb,#4f46e5);

color:white;

font-size:32px;

box-shadow:
0 18px 40px rgba(37,99,235,.30);

margin-bottom:18px;

}

.logo-icon{

animation:floatLogo 3s ease-in-out infinite;

}

@keyframes floatLogo{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-5px);

}

}

        h1{

font-size:36px;

font-weight:800;

margin-bottom:10px;

color:#0f172a;

}

       .subtitle{

font-size:17px;

font-weight:500;

color:#64748b;

line-height:1.6;

margin-bottom:35px;

}

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input{

width:100%;

height:58px;

padding:0 18px;

border:none;

background:#f8fafc;

border-radius:14px;

font-size:15px;

transition:.3s;

box-shadow:
0 5px 15px rgba(0,0,0,.04);

}

input:focus{

background:white;

box-shadow:0 0 0 4px rgba(37,99,235,.12);

}


        button{

width:100%;

height:58px;

margin-top: 18px;

border:none;

border-radius:14px;

background:
linear-gradient(135deg,#2563eb,#4f46e5);

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.35s;

box-shadow:
0 15px 35px rgba(37,99,235,.25);

}

button:hover{

transform:translateY(-4px);

box-shadow:
0 22px 45px rgba(37,99,235,.35);

}

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: 600;
        }

        .back{

margin-top:30px;

text-align:center;

}

.back a{

font-weight:700;

color:#2563eb;

transition:.3s;

}

.back a:hover{

color:#1d4ed8;

}


    </style>
</head>

<body>

<div class="login-box">

<div class="logo">

<div class="logo-icon">
<i class="fa-solid fa-user-shield"></i>
</div>

<h1>QueueLess</h1>

<p class="subtitle">
Secure Admin Portal
</p>

</div>

<form id="adminLoginForm" autocomplete="off">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            name="admin-email"
            placeholder="Admin Email Address"
            autocomplete="off"
            required
        >

        <label for="password">
            Password
        </label>

        <input
type="password"
id="password"
name="admin-password"
placeholder="Enter Secure Password"
autocomplete="new-password"
required
>

<button type="submit">
🔐 Login to Dashboard
</button>

</form>

    <div id="message"></div>

    <div class="back">
        <a href="index.html">
            ← Back to Home
        </a>
    </div>

</div>


<script>
    // =========================================
    // ADMIN LOGIN
    // =========================================

    document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.textContent = "Checking...";
            message.style.color = "#555";

            try {

                const response = await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();


                // =========================================
                // LOGIN FAILED
                // =========================================

                if (!response.ok || !data.success) {

                    message.textContent =
                        data.message ||
                        "Invalid admin email or password";

                    message.style.color = "red";

                    return;
                }


                // =========================================
                // LOGIN SUCCESS
                // =========================================

                localStorage.setItem(
                    "adminToken",
                    data.token
                );

                message.textContent =
                    "Login successful!";

                message.style.color =
                    "green";


                // Clear form before leaving
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";


                // =========================================
                // IMPORTANT
                // Replace login page in browser history
                // =========================================

                window.location.replace("admin.html");

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Cannot connect to QueueLess server.";

                message.style.color =
                    "red";
            }
        });


    // =========================================
    // PAGE SHOW / BACK BUTTON PROTECTION
    // =========================================

    window.addEventListener(
        "pageshow",
        function () {

            const adminToken =
                localStorage.getItem("adminToken");


            // Admin is already logged in
            // Don't allow admin login page again
            if (adminToken) {

                window.location.replace(
                    "admin.html"
                );

                return;
            }


            // Clear login fields
            const emailInput =
                document.getElementById("email");

            const passwordInput =
                document.getElementById("password");

            if (emailInput) {
                emailInput.value = "";
            }

            if (passwordInput) {
                passwordInput.value = "";
            }


            // Clear old messages
            const message =
                document.getElementById("message");

            if (message) {
                message.textContent = "";
            }
        }
    );
</script>

</body>
</html>
