<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | QueueLess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

overflow:hidden;

background:linear-gradient(
135deg,
#ffffff 0%,
#eef2ff 40%,
#dbeafe 100%
);

position:relative;

}

/*==========================
BACKGROUND
==========================*/

.bg-circle{

position:absolute;
border-radius:50%;
filter:blur(4px);

animation:float 12s ease-in-out infinite;

}

.bg1{

width:320px;
height:320px;

background:#3b82f630;

top:-120px;
left:-100px;

}

.bg2{

width:250px;
height:250px;

background:#60a5fa30;

right:-80px;
top:80px;

animation-duration:15s;

}

.bg3{

width:220px;
height:220px;

background:#2563eb20;

bottom:-80px;
left:15%;

animation-duration:18s;

}

.bg4{

width:180px;
height:180px;

background:#93c5fd30;

bottom:70px;
right:8%;

animation-duration:20s;

}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-35px);
}

100%{
transform:translateY(0);
}

}

/*==========================
CARD
==========================*/

.login-card{

position:relative;

z-index:10;

width:100%;
max-width:450px;

padding:28px 30px;

background:rgba(255,255,255,.92);

backdrop-filter:blur(28px);

border:1px solid rgba(255,255,255,.65);

border-radius:28px;

box-shadow:

0 35px 90px rgba(79,70,229,.18),

0 15px 35px rgba(0,0,0,.08);

transition:.35s;

}

.login-card:hover{

transform:translateY(-6px);

box-shadow:
0 45px 90px rgba(37,99,235,.20);

}

/*==========================
LOGO
==========================*/

.logo{

display:flex;

justify-content:center;
align-items:center;

gap:14px;

margin-bottom:16px;

text-decoration:none;

}

.logo-box{

width:66px;
height:66px;

display:flex;
justify-content:center;
align-items:center;

border-radius:18px;

background:
linear-gradient(
135deg,
#6d5efc,
#4f46e5
);

color:white;

font-size:30px;

box-shadow:

0 18px 45px rgba(91,78,245,.35),

0 0 35px rgba(91,78,245,.20);

position:relative;

overflow:hidden;

}

.logo-box::before{

content:"";

position:absolute;

top:-40%;
left:-80%;

width:55%;
height:180%;

background:rgba(255,255,255,.40);

transform:rotate(25deg);

animation:shine 6s linear infinite;

}

.logo-text h2{

font-size:32px;

font-weight:800;

color:#111827;

}

.logo-text span{

color:#4f46e5;

}

.logo-text p{

margin-top:4px;

font-size:13px;

color:#64748b;

}

.login-card h1{

text-align:center;

font-size:30px;

font-weight:700;

color:#0f172a;

margin-bottom:8px;

}

.subtitle{

text-align:center;

font-size:15px;

line-height:26px;

color:#64748b;

margin-bottom:18px;

}

/*==========================
FORM
==========================*/

.form-group{

margin-bottom:16px;

}

.form-group label{

display:block;

font-size:14px;

font-weight:600;

margin-bottom:8px;

color:#334155;

}

.input-box{

height:58px;

display:flex;

align-items:center;

padding:0 18px;

border-radius:18px;

background:white;

border:2px solid transparent;

transition:.3s;

box-shadow:
0 8px 20px rgba(15,23,42,.04);

}

.input-box:hover{

transform:translateY(-2px);

}

.input-box:focus-within{

border-color:#2563eb;

box-shadow:0 0 0 5px rgba(37,99,235,.12);

}

.input-box i{

width:26px;

text-align:center;

color:#2563eb;

font-size:18px;

}

.input-box input{

flex:1;

border:none;

outline:none;

background:transparent;

padding-left:12px;

font-size:15px;

color:#0f172a;

}

.input-box input::placeholder{

color:#94a3b8;

}

.eye-button{

border:none;

background:none;

cursor:pointer;

font-size:18px;

color:#64748b;

transition:.25s;

}

.eye-button:hover{

color:#2563eb;

transform:scale(1.15);

}




.login-button{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:
linear-gradient(135deg,#2563eb,#3b82f6,#60a5fa);

background-size:200%;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.35s;

box-shadow:
0 18px 35px rgba(37,99,235,.25);

}

.login-button:hover{

background-position:right;

transform:translateY(-3px);

}

.login-button:disabled{

opacity:.75;

cursor:not-allowed;

transform:none;

}

/*==========================
MESSAGE
==========================*/

#message{

min-height:22px;

margin-top:12px;

margin-bottom:10px;

font-size:14px;

font-weight:600;

text-align:center;

}



/*==========================
BACK BUTTON
==========================*/

.back-home{

display:block;

margin-top:24px;

text-align:center;

font-size:14px;

text-decoration:none;

color:#64748b;

transition:.25s;

}

.back-home:hover{

color:#2563eb;

}

/*==========================
FOOTER
==========================*/

.login-footer{

margin-top:18px;

display:flex;

justify-content:center;

align-items:center;

gap:8px;

font-size:12px;

font-weight:500;

color:#94a3b8;

}

.login-footer i{

color:#6366f1;

}

/*==========================
SPINNER
==========================*/

.spinner{

display:inline-block;

width:18px;
height:18px;

border:3px solid rgba(255,255,255,.4);

border-top:3px solid white;

border-radius:50%;

animation:spin 1s linear infinite;

margin-right:10px;

vertical-align:middle;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

@keyframes shine{

0%{

left:-80%;

}

100%{

left:160%;

}

}

/*==========================
RESPONSIVE
==========================*/

@media(max-width:520px){

.login-card{

padding:30px 24px;

}

.logo-text h2{

font-size:28px;

}

.login-card h1{

font-size:28px;

}

}

</style>

</head>

<body>

<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>
<div class="bg-circle bg3"></div>
<div class="bg-circle bg4"></div>

<div class="login-card">

<a href="index.html" class="logo">

<div class="logo-box">

Q

</div>

<div class="logo-text">

<h2>Queue<span>Less</span></h2>

<p>Smart Queue Management</p>

</div>

</a>

<h1>Admin Login</h1>

<p class="subtitle">

Login to access QueueLess Admin Dashboard.

</p>


<form id="adminLoginForm" autocomplete="off">

<div class="form-group">

<label for="email">

Admin Email

</label>

<div class="input-box">

<i class="fas fa-envelope"></i>

<input
type="email"
id="email"
name="admin-email"
placeholder="Enter admin email"
autocomplete="off"
required>

</div>

</div>

<div class="form-group">

<label for="password">

Password

</label>

<div class="input-box">

<i class="fas fa-lock"></i>

<input
type="password"
id="password"
name="admin-password"
placeholder="Enter secure password"
autocomplete="new-password"
required>

<button
type="button"
class="eye-button"
onclick="togglePassword()">

<i class="fas fa-eye"></i>

</button>

</div>

</div>


<button
type="submit"
class="login-button"
id="loginButton">

<span id="btnText">

<i class="fas fa-user-shield"></i>

Login to Dashboard

</span>

</button>

<div id="message"></div>


<a
href="index.html"
class="back-home">

<i class="fas fa-arrow-left"></i>

Back to Home

</a>

<p class="login-footer">

<i class="fas fa-shield-halved"></i>

Secure Queue Management System

</p>

</form>


</div>

<script>

/*=========================================
SHOW / HIDE PASSWORD
=========================================*/

function togglePassword(){

const passwordInput=document.getElementById("password");

const icon=document.querySelector(".eye-button i");

if(passwordInput.type==="password"){

passwordInput.type="text";

icon.classList.remove("fa-eye");
icon.classList.add("fa-eye-slash");

}else{

passwordInput.type="password";

icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");

}

}

/*=========================================
ELEMENTS
=========================================*/

const adminLoginForm=
document.getElementById("adminLoginForm");

const loginButton=
document.getElementById("loginButton");

const message=
document.getElementById("message");

const emailInput=
document.getElementById("email");

const passwordInput=
document.getElementById("password");

/*=========================================
CLEAR FORM
=========================================*/

function clearForm(){

adminLoginForm.reset();

emailInput.value="";
passwordInput.value="";

passwordInput.type="password";

const icon=document.querySelector(".eye-button i");

if(icon){

icon.classList.remove("fa-eye-slash");
icon.classList.add("fa-eye");

}

message.textContent="";

loginButton.disabled=false;

loginButton.innerHTML=
'<span id="btnText"><i class="fas fa-user-shield"></i> Login to Dashboard</span>';

}

/*=========================================
CHECK ADMIN SESSION
=========================================*/

window.addEventListener("pageshow",function(){

const adminToken=localStorage.getItem("adminToken");

if(adminToken){

window.location.replace("admin.html");

return;

}

clearForm();

});

/*=========================================
ADMIN LOGIN
=========================================*/

adminLoginForm.addEventListener(

"submit",

async function(event){

event.preventDefault();

const email=emailInput.value.trim().toLowerCase();

const password=passwordInput.value;

if(!email||!password){

message.style.color="red";

message.textContent="Please enter admin email and password.";

return;

}

loginButton.disabled=true;

loginButton.innerHTML=
'<span class="spinner"></span> Logging in...';

message.style.color="#64748b";

message.textContent="Checking admin credentials...";

try{

const response=await fetch(

"/api/admin/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email,

password:password

})

}

);

const data=await response.json();

if(response.ok && data.success){

localStorage.removeItem("adminToken");

localStorage.setItem(

"adminToken",

data.token

);

message.style.color="green";

message.textContent="Login successful! Opening dashboard...";

setTimeout(function(){

window.location.replace("admin.html");

},700);

}

else{

localStorage.removeItem("adminToken");

passwordInput.value="";

message.style.color="red";

message.textContent=

data.message ||

"Invalid admin email or password";

}

}

catch(error){

console.error(error);

localStorage.removeItem("adminToken");

passwordInput.value="";

message.style.color="red";

message.textContent=

"Cannot connect to QueueLess server.";

}

finally{

loginButton.disabled=false;

loginButton.innerHTML=
'<span id="btnText"><i class="fas fa-user-shield"></i> Login to Dashboard</span>';

}

}

);

</script>

</body>

</html>
