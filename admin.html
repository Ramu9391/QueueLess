<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | QueueLess</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8ff;
            color: #111827;
        }

        .navbar {
            height: 80px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 23px;
            font-weight: bold;
        }

        .logo-box {
            width: 45px;
            height: 45px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            font-size: 22px;
        }

        .logo span {
            color: #2563eb;
        }

        .admin-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-name {
            font-weight: bold;
        }

        .logout-btn {
            padding: 10px 18px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #f3f4f6;
        }

        .container {
            width: 84%;
            max-width: 1250px;
            margin: 45px auto;
        }

        .small-title {
            color: #2563eb;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 35px;
        }

        .service-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .service-card label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
        }

        .stat-title {
            color: #6b7280;
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }

        .blue {
            color: #2563eb;
        }

        .green {
            color: #16a34a;
        }

        .current-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
        }

        .current-label {
            color: #6b7280;
            font-weight: bold;
            font-size: 14px;
        }

        .current-token {
            font-size: 55px;
            color: #2563eb;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        .current-service {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .complete-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .complete-btn:hover {
            background: #15803d;
        }

        .waiting-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
        }

        .waiting-header {
            padding: 22px 25px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
        }

        .waiting-header h2 {
            font-size: 20px;
        }

        .waiting-count {
            color: #2563eb;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #475569;
            text-align: left;
            padding: 16px 25px;
        }

        td {
            padding: 17px 25px;
            border-top: 1px solid #e5e7eb;
        }

        .token {
            color: #2563eb;
            font-weight: bold;
        }

        .waiting-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .empty-message {
            padding: 35px;
            text-align: center;
            color: #6b7280;
        }

        #message {
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
        }

        @media(max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 4%;
            }

            .container {
                width: 92%;
            }

            h1 {
                font-size: 28px;
            }

            .admin-name {
                display: none;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <div class="logo-box">Q</div>
            Queue<span>Less</span>
        </div>

        <div class="admin-area">

            <div class="admin-name">
                👤 QueueLess Admin
            </div>

            <button
                class="logout-btn"
                onclick="logoutAdmin()"
            >
                Logout
            </button>

        </div>

    </nav>


    <main class="container">

        <div class="small-title">
            ADMIN DASHBOARD
        </div>

        <h1>Queue Management</h1>

        <p class="description">
            Manage queues and call the next token.
        </p>


        <!-- SERVICE SELECT -->

        <div class="service-card">

            <label for="serviceSelect">
                Select Service
            </label>

            <select
                id="serviceSelect"
                onchange="changeService()"
            >

                <option value="College Administration">
                    🏫 College Administration
                </option>

                <option value="Accounts & Fee Counter">
                    💳 Accounts & Fee Counter
                </option>

                <option value="Library">
                    📚 Library
                </option>

                <option value="Hostel Office">
                    🏠 Hostel Office
                </option>

                <option value="IT Help Desk">
                    💻 IT Help Desk
                </option>

                <option value="General Enquiry">
                    ℹ️ General Enquiry
                </option>

                <option value="College Canteen">
                    🍔 College Canteen
                </option>

                <option value="Cafe / Food Court">
                    ☕ Cafe / Food Court
                </option>

                <option value="Transport Office">
                    🚌 Transport Office
                </option>

                <option value="Campus Medical Center">
                    🏥 Campus Medical Center
                </option>

                <option value="Exam Cell">
                    📝 Exam Cell
                </option>

                <option value="Placement Cell">
                    💼 Placement Cell
                </option>

            </select>

        </div>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-title">
                    Now Serving
                </div>

                <div
                    class="stat-number blue"
                    id="nowServingSmall"
                >
                    --
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-title">
                    People Waiting
                </div>

                <div
                    class="stat-number"
                    id="peopleWaiting"
                >
                    0
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-title">
                    Completed Today
                </div>

                <div
                    class="stat-number green"
                    id="completedToday"
                >
                    0
                </div>
            </div>

        </div>


        <!-- CURRENT TOKEN -->

        <div class="current-card">

            <div class="current-label">
                NOW SERVING
            </div>

            <div
                class="current-token"
                id="currentToken"
            >
                --
            </div>

            <div
                class="current-service"
                id="currentService"
            >
                College Administration
            </div>


            <div class="buttons">

                <button
                    class="primary-btn"
                    onclick="callNext()"
                >
                    📢 Call Next
                </button>

                <button
                    class="complete-btn"
                    onclick="completeCurrent()"
                >
                    ✓ Complete Current
                </button>

            </div>

        </div>


        <div id="message"></div>


        <!-- WAITING TOKENS -->

        <div class="waiting-card">

            <div class="waiting-header">

                <h2>Waiting Tokens</h2>

                <div class="waiting-count">

                    <span id="waitingCount">
                        0
                    </span>

                    waiting

                </div>

            </div>


            <table>

                <thead>

                    <tr>
                        <th>Position</th>
                        <th>Token</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="waitingTable">
                </tbody>

            </table>


            <div
                class="empty-message"
                id="emptyMessage"
            >
                No waiting tokens for this service.
            </div>

        </div>

    </main>


    <script>

        // =========================================
        // ADMIN LOGIN CHECK - FIXED
        // =========================================

        const adminToken =
            localStorage.getItem("adminToken");

        if (!adminToken) {
            window.location.href =
                "admin-login.html";
        }


        // =========================================
        // API
        // =========================================

        const API_URL =
            "";


        // =========================================
        // CURRENT SERVICE
        // =========================================

        let selectedService =
            "College Administration";


        // =========================================
        // CHANGE SERVICE
        // =========================================

        function changeService() {

            selectedService =
                document.getElementById(
                    "serviceSelect"
                ).value;

            document.getElementById(
                "currentService"
            ).textContent =
                selectedService;

            loadQueue();
        }


        // =========================================
        // LOAD REAL QUEUE
        // =========================================

        async function loadQueue() {

            try {

                const response =
                    await fetch(

                        API_URL +

                        "/api/admin/queue/" +

                        encodeURIComponent(
                            selectedService
                        ),

                        {
                            headers: {
                                "Authorization":
                                    "Bearer " + adminToken
                            }
                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to load queue.",
                        "#dc2626"
                    );

                    return;
                }


                document.getElementById(
                    "currentService"
                ).textContent =
                    selectedService;


                const nowServing =
                    data.nowServing || "--";


                document.getElementById(
                    "currentToken"
                ).textContent =
                    nowServing;


                document.getElementById(
                    "nowServingSmall"
                ).textContent =
                    nowServing;


                document.getElementById(
                    "peopleWaiting"
                ).textContent =
                    data.peopleWaiting || 0;


                document.getElementById(
                    "waitingCount"
                ).textContent =
                    data.peopleWaiting || 0;


                document.getElementById(
                    "completedToday"
                ).textContent =
                    data.completedToday || 0;


                const table =
                    document.getElementById(
                        "waitingTable"
                    );


                const emptyMessage =
                    document.getElementById(
                        "emptyMessage"
                    );


                table.innerHTML = "";


                if (
                    !data.waitingTokens ||
                    data.waitingTokens.length === 0
                ) {

                    emptyMessage.style.display =
                        "block";

                } else {

                    emptyMessage.style.display =
                        "none";


                    data.waitingTokens.forEach(
                        function(token, index) {

                            const row =
                                document.createElement(
                                    "tr"
                                );


                            row.innerHTML = `

                                <td>
                                    #${index + 1}
                                </td>

                                <td class="token">
                                    ${token.tokenNumber}
                                </td>

                                <td>

                                    <span class="waiting-badge">
                                        Waiting
                                    </span>

                                </td>
                            `;


                            table.appendChild(row);

                        }
                    );
                }

            } catch (error) {

                console.error(
                    "LOAD QUEUE ERROR:",
                    error
                );


                showMessage(
                    "Cannot connect to QueueLess server.",
                    "#dc2626"
                );
            }
        }


        // =========================================
        // CALL NEXT
        // =========================================

        async function callNext() {

            try {

                const response =
                    await fetch(

                        API_URL +
                        "/api/admin/call-next",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + adminToken

                            },

                            body:
                                JSON.stringify({

                                    service:
                                        selectedService

                                })

                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to call next token.",
                        "#dc2626"
                    );

                    return;
                }


                showMessage(

                    "📢 Now serving " +
                    data.tokenNumber,

                    "#2563eb"

                );


                await loadQueue();


            } catch (error) {

                console.error(
                    "CALL NEXT ERROR:",
                    error
                );


                showMessage(
                    "Cannot connect to server.",
                    "#dc2626"
                );
            }
        }


        // =========================================
        // COMPLETE CURRENT
        // =========================================

        async function completeCurrent() {

            try {

                const response =
                    await fetch(

                        API_URL +
                        "/api/admin/complete-current",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + adminToken

                            },

                            body:
                                JSON.stringify({

                                    service:
                                        selectedService

                                })

                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to complete token.",
                        "#dc2626"
                    );

                    return;
                }


                showMessage(

                    "✓ " +
                    data.tokenNumber +
                    " completed successfully",

                    "#16a34a"

                );


                await loadQueue();


            } catch (error) {

                console.error(
                    "COMPLETE TOKEN ERROR:",
                    error
                );


                showMessage(
                    "Cannot connect to server.",
                    "#dc2626"
                );
            }
        }


        // =========================================
        // MESSAGE
        // =========================================

        function showMessage(
            text,
            color
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.style.color =
                color;


            setTimeout(
                function() {

                    message.textContent =
                        "";

                },
                4000
            );
        }


        // =========================================
        // LOGOUT - FIXED
        // =========================================

        function logoutAdmin() {

            localStorage.removeItem("adminToken");
                

             window.location.replace("index.html");

        }


        // =========================================
        // START + AUTO REFRESH
        // =========================================

        loadQueue();


        setInterval(
            loadQueue,
            3000
        );

    </script>

</body>

</html>
