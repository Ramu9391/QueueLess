<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | QueueLess</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{

    margin:0;
    color:#111827;

    background:
    radial-gradient(circle at 8% 15%,rgba(37,99,235,.16),transparent 20%),
    radial-gradient(circle at 85% 82%,rgba(37,99,235,.12),transparent 18%),
    radial-gradient(circle at 95% 18%,rgba(99,102,241,.12),transparent 15%),
    radial-gradient(circle at 20% 92%,rgba(99,102,241,.10),transparent 18%),
    linear-gradient(
    135deg,
    #ffffff 0%,
    #eef2ff 45%,
    #dbeafe 100%
    );

    min-height:100vh;

}

        .navbar{

height:82px;

position:relative;

top:10px;

width:85%;
max-width:1400px;

margin:20px auto;

left:0;

right:0;

z-index:1000;

background:rgba(255,255,255,.88);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.5);

border-radius:20px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

box-shadow:
0 10px 30px rgba(37,99,235,.08);

}



        .logo{

display:flex;

align-items:center;

gap:14px;

font-size:18px;

font-weight:800;

}



        .logo-box{

width:48px;

height:48px;

display:flex;

align-items:center;

justify-content:center;

border-radius:14px;

background:linear-gradient(135deg,#2563eb,#4f46e5);

color:#fff;

font-size:24px;

font-weight:700;

box-shadow:
0 15px 35px rgba(37,99,235,.25);

}



        .logo span {
            color: #2563eb;
        }

        .admin-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-name {
            font-weight: bold;
        }

        .logout-btn{

padding:12px 22px;

border:none;

border-radius:12px;

background:white;

font-weight:700;

cursor:pointer;

transition:.3s;

box-shadow:
0 10px 25px rgba(37,99,235,.08);

}

.logout-btn:hover{

transform:translateY(-2px);

box-shadow:
0 18px 35px rgba(37,99,235,.18);

}


        .logout-btn:hover {
            background: #f3f4f6;
        }


        .container{

width:85%;
max-width:1400px;

margin:105px auto 50px;

}


        .small-title {
            color: #2563eb;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 35px;
        }

        .service-card{

background:rgba(255,255,255,.94);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.45);

border-radius:20px;

padding:25px;

box-shadow:
0 12px 35px rgba(37,99,235,.08);

margin-bottom:25px;

transition:.35s;

}

.service-card:hover{

transform:translateY(-5px);

box-shadow:
0 20px 45px rgba(37,99,235,.15);

}



        .service-card label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        select{

width:100%;

padding:15px;

border-radius:14px;

border:1px solid #dbe3f3;

background:white;

font-size:15px;

transition:.3s;

}

select:focus{

outline:none;

border-color:#4f46e5;

box-shadow:
0 0 0 4px rgba(79,70,229,.12);

}

select:hover{

border-color:#4f46e5;

}


        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card{

background:rgba(255,255,255,.94);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.45);

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:
0 12px 35px rgba(37,99,235,.08);

transition:.35s;

}

.stat-card:hover{

transform:translateY(-5px);

box-shadow:
0 20px 45px rgba(37,99,235,.15);

}



        .stat-title {
            color: #6b7280;
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }

        .blue {
            color: #2563eb;
        }

        .green {
            color: #16a34a;
        }

        .current-card{

background:rgba(255,255,255,.94);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.45);

border-radius:20px;

padding:35px;

text-align:center;

margin-bottom:25px;

box-shadow:
0 12px 35px rgba(37,99,235,.08);

transition:.35s;

}

.current-card:hover{

transform:translateY(-5px);

box-shadow:
0 20px 45px rgba(37,99,235,.15);

}



        .current-label {
            color: #6b7280;
            font-weight: bold;
            font-size: 14px;
        }

        .current-token {
            font-size: 55px;
            color: #2563eb;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        .current-service {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .primary-btn{

background:linear-gradient(135deg,#2563eb,#4f46e5);

color:white;

border:none;

padding:14px 28px;

border-radius:12px;

font-weight:700;

cursor:pointer;

transition:.3s;

box-shadow:
0 12px 30px rgba(37,99,235,.25);

}

.primary-btn:hover{

transform:translateY(-4px) scale(1.03);

box-shadow:
0 22px 45px rgba(37,99,235,.35);

}


       .complete-btn{

background:linear-gradient(135deg,#22c55e,#16a34a);

color:white;

border:none;

padding:14px 28px;

border-radius:12px;

font-weight:700;

cursor:pointer;

transition:.3s;

box-shadow:
0 12px 30px rgba(22,163,74,.25);

}

.complete-btn:hover{

transform:translateY(-3px);

box-shadow:
0 18px 40px rgba(22,163,74,.35);

}

        .complete-btn:hover {
            background: #15803d;
        }

        .waiting-card{

background:rgba(255,255,255,.94);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.45);

border-radius:20px;

overflow:hidden;

box-shadow:
0 12px 35px rgba(37,99,235,.08);

transition:.35s;

}

.waiting-card:hover{

transform:translateY(-5px);

box-shadow:
0 20px 45px rgba(37,99,235,.15);

}



        .waiting-header {
            padding: 22px 25px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
        }

        .waiting-header h2 {
            font-size: 20px;
        }

        .waiting-count {
            color: #2563eb;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th{

background:#eef4ff;

color:#1e3a8a;

text-align:left;

padding:18px 25px;

font-weight:700;

}

        tbody tr{

transition:.3s;

}

tbody tr:hover{

background:#f8fbff;

}



        .token {
            color: #2563eb;
            font-weight: bold;
        }

        .waiting-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .empty-message {
            padding: 35px;
            text-align: center;
            color: #6b7280;
        }

        #message {
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
        }

        @media(max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 4%;
            }

            .container {
                width: 92%;
            }

            h1 {
                font-size: 28px;
            }

            .admin-name {
                display: none;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <div class="logo-box">Q</div>
            Queue<span>Less</span>
        </div>

        <div class="admin-area">

            <div class="admin-name">
                👤 QueueLess Admin
            </div>

            <button
                class="logout-btn"
                onclick="logoutAdmin()"
            >
                Logout
            </button>

        </div>

    </nav>


    <main class="container">

        <div class="small-title">
            ADMIN DASHBOARD
        </div>

        <h1>Queue Management</h1>

        <p class="description">
            Manage queues and call the next token.
        </p>


        <!-- SERVICE SELECT -->

        <div class="service-card">

            <label for="serviceSelect">
                Select Service
            </label>

            <select
                id="serviceSelect"
                onchange="changeService()"
            >

                <option value="College Administration">
                    🏫 College Administration
                </option>

                <option value="Accounts & Fee Counter">
                    💳 Accounts & Fee Counter
                </option>

                <option value="Library">
                    📚 Library
                </option>

                <option value="Hostel Office">
                    🏠 Hostel Office
                </option>

                <option value="IT Help Desk">
                    💻 IT Help Desk
                </option>

                <option value="General Enquiry">
                    ℹ️ General Enquiry
                </option>

                <option value="College Canteen">
                    🍔 College Canteen
                </option>

                <option value="Cafe / Food Court">
                    ☕ Cafe / Food Court
                </option>

                <option value="Transport Office">
                    🚌 Transport Office
                </option>

                <option value="Campus Medical Center">
                    🏥 Campus Medical Center
                </option>

                <option value="Exam Cell">
                    📝 Exam Cell
                </option>

                <option value="Placement Cell">
                    💼 Placement Cell
                </option>

            </select>

        </div>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-title">
                    Now Serving
                </div>

                <div
                    class="stat-number blue"
                    id="nowServingSmall"
                >
                    --
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-title">
                    People Waiting
                </div>

                <div
                    class="stat-number"
                    id="peopleWaiting"
                >
                    0
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-title">
                    Completed Today
                </div>

                <div
                    class="stat-number green"
                    id="completedToday"
                >
                    0
                </div>
            </div>

        </div>


        <!-- CURRENT TOKEN -->

        <div class="current-card">

            <div class="current-label">
                NOW SERVING
            </div>

            <div
                class="current-token"
                id="currentToken"
            >
                --
            </div>

            <div
                class="current-service"
                id="currentService"
            >
                College Administration
            </div>


            <div class="buttons">

                <button
                    class="primary-btn"
                    onclick="callNext()"
                >
                    📢 Call Next
                </button>

                <button
                    class="complete-btn"
                    onclick="completeCurrent()"
                >
                    ✓ Complete Current
                </button>

            </div>

        </div>


        <div id="message"></div>


        <!-- WAITING TOKENS -->

        <div class="waiting-card">

            <div class="waiting-header">

                <h2>Waiting Tokens</h2>

                <div class="waiting-count">

                    <span id="waitingCount">
                        0
                    </span>

                    waiting

                </div>

            </div>


            <table>

                <thead>

                    <tr>
                        <th>Position</th>
                        <th>Token</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="waitingTable">
                </tbody>

            </table>


            <div
                class="empty-message"
                id="emptyMessage"
            >
                No waiting tokens for this service.
            </div>

        </div>

    </main>


    <script>

        // =========================================
        // ADMIN LOGIN CHECK - FIXED
        // =========================================

        const adminToken =
            localStorage.getItem("adminToken");

        if (!adminToken) {
            window.location.href =
                "admin-login.html";
        }


        // =========================================
        // API
        // =========================================

        const API_URL =
            "";


        // =========================================
        // CURRENT SERVICE
        // =========================================

        let selectedService =
            "College Administration";


        // =========================================
        // CHANGE SERVICE
        // =========================================

        function changeService() {

            selectedService =
                document.getElementById(
                    "serviceSelect"
                ).value;

            document.getElementById(
                "currentService"
            ).textContent =
                selectedService;

            loadQueue();
        }


        // =========================================
        // LOAD REAL QUEUE
        // =========================================

        async function loadQueue() {

            try {

                const response =
                    await fetch(

                        API_URL +

                        "/api/admin/queue/" +

                        encodeURIComponent(
                            selectedService
                        ),

                        {
                            headers: {
                                "Authorization":
                                    "Bearer " + adminToken
                            }
                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to load queue.",
                        "#dc2626"
                    );

                    return;
                }


                document.getElementById(
                    "currentService"
                ).textContent =
                    selectedService;


                const nowServing =
                    data.nowServing || "--";


                document.getElementById(
                    "currentToken"
                ).textContent =
                    nowServing;


                document.getElementById(
                    "nowServingSmall"
                ).textContent =
                    nowServing;


                document.getElementById(
                    "peopleWaiting"
                ).textContent =
                    data.peopleWaiting || 0;


                document.getElementById(
                    "waitingCount"
                ).textContent =
                    data.peopleWaiting || 0;


                document.getElementById(
                    "completedToday"
                ).textContent =
                    data.completedToday || 0;


                const table =
                    document.getElementById(
                        "waitingTable"
                    );


                const emptyMessage =
                    document.getElementById(
                        "emptyMessage"
                    );


                table.innerHTML = "";


                if (
                    !data.waitingTokens ||
                    data.waitingTokens.length === 0
                ) {

                    emptyMessage.style.display =
                        "block";

                } else {

                    emptyMessage.style.display =
                        "none";


                    data.waitingTokens.forEach(
                        function(token, index) {

                            const row =
                                document.createElement(
                                    "tr"
                                );


                            row.innerHTML = `

                                <td>
                                    #${index + 1}
                                </td>

                                <td class="token">
                                    ${token.tokenNumber}
                                </td>

                                <td>

                                    <span class="waiting-badge">
                                        Waiting
                                    </span>

                                </td>
                            `;


                            table.appendChild(row);

                        }
                    );
                }

            } catch (error) {

                console.error(
                    "LOAD QUEUE ERROR:",
                    error
                );


                showMessage(
                    "Cannot connect to QueueLess server.",
                    "#dc2626"
                );
            }
        }


        // =========================================
        // CALL NEXT
        // =========================================

        async function callNext() {

            try {

                const response =
                    await fetch(

                        API_URL +
                        "/api/admin/call-next",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + adminToken

                            },

                            body:
                                JSON.stringify({

                                    service:
                                        selectedService

                                })

                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to call next token.",
                        "#dc2626"
                    );

                    return;
                }


                showMessage(

                    "📢 Now serving " +
                    data.tokenNumber,

                    "#2563eb"

                );


                await loadQueue();


            } catch (error) {

                console.error(
                    "CALL NEXT ERROR:",
                    error
                );


                showMessage(
                    "Cannot connect to server.",
                    "#dc2626"
                );
            }
        }


        // =========================================
        // COMPLETE CURRENT
        // =========================================

        async function completeCurrent() {

            try {

                const response =
                    await fetch(

                        API_URL +
                        "/api/admin/complete-current",

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + adminToken

                            },

                            body:
                                JSON.stringify({

                                    service:
                                        selectedService

                                })

                        }
                    );


                const data =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem(
                        "adminToken"
                    );

                    window.location.href =
                        "admin-login.html";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Unable to complete token.",
                        "#dc2626"
                    );

                    return;
                }


                showMessage(

                    "✓ " +
                    data.tokenNumber +
                    " completed successfully",

                    "#16a34a"

                );


                await loadQueue();


            } catch (error) {

                console.error(
                    "COMPLETE TOKEN ERROR:",
                    error
                );


                showMessage(
                    "Cannot connect to server.",
                    "#dc2626"
                );
            }
        }


        // =========================================
        // MESSAGE
        // =========================================

        function showMessage(
            text,
            color
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.style.color =
                color;


            setTimeout(
                function() {

                    message.textContent =
                        "";

                },
                4000
            );
        }


        // =========================================
        // LOGOUT - FIXED
        // =========================================

        function logoutAdmin() {

            localStorage.removeItem("adminToken");
                

             window.location.replace("index.html");

        }


        // =========================================
        // START + AUTO REFRESH
        // =========================================

        loadQueue();


        setInterval(
            loadQueue,
            3000
        );

    </script>

</body>

</html>
