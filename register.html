<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

    <title>Register | QueueLess</title>

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}


       body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:0;

    overflow:hidden;

    background:linear-gradient(
        135deg,
        #ffffff 0%,
        #eef2ff 40%,
        #dbeafe 100%
    );

    position:relative;
}


        /*=============================
FLOATING BACKGROUND
=============================*/

.bg-circle{

    position:absolute;
    border-radius:50%;
    filter:blur(4px);
    animation:float 12s ease-in-out infinite;

}

.bg1{

    width:320px;
    height:320px;

    background:#3b82f630;

    top:-120px;
    left:-100px;

}

.bg2{

    width:250px;
    height:250px;

    background:#60a5fa30;

    right:-80px;
    top:80px;

    animation-duration:15s;

}

.bg3{

    width:220px;
    height:220px;

    background:#2563eb20;

    bottom:-80px;
    left:15%;

    animation-duration:18s;

}

.bg4{

    width:180px;
    height:180px;

    background:#93c5fd30;

    bottom:70px;
    right:8%;

    animation-duration:20s;

}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-35px);
    }

    100%{
        transform:translateY(0px);
    }

}
    

        .register-card{

    position:relative;
    z-index:10;

    width:100%;
    max-width:450px;

    margin:0;

    padding:20px 30px;

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(28px);

    border:1px solid rgba(255,255,255,.65);

    border-radius:28px;

    box-shadow:
        0 35px 90px rgba(79,70,229,.18),
        0 15px 35px rgba(0,0,0,.08);

    transition:.35s;

}



        .register-card:hover{

    transform:translateY(-6px);

    box-shadow:
        0 45px 90px rgba(37,99,235,.20);

}


         @keyframes fadeIn {
             from {
                  opacity: 0;
                 transform: translateY(25px);
            }
             to {
                 opacity: 1;
                 transform: translateY(0);
            }
}

.logo{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:14px;

    margin-bottom:10px;

    text-decoration:none;

}

.logo-box{

    width:58px;
    height:58px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #6d5efc,
            #4f46e5
        );

    color:white;

    font-size:30px;
    font-weight:800;

    box-shadow:
        0 18px 45px rgba(91,78,245,.35),
        0 0 35px rgba(91,78,245,.20);

    position:relative;

    overflow:hidden;

}

.logo-box::before{

    content:"";

    position:absolute;

    top:-40%;
    left:-80%;

    width:55%;
    height:180%;

    background:rgba(255,255,255,.40);

    transform:rotate(25deg);

    animation:shine 6s linear infinite;

}

.logo-text h2{

    font-size:32px;
    font-weight:800;

    color:#111827;

    margin:0;

}

.logo-text span{

    color:#4f46e5;

}

.logo-text p{

    margin-top:4px;

    font-size:13px;

    color:#64748b;

}

@keyframes shine{

    0%{
        left:-80%;
    }

    100%{
        left:160%;
    }

}

        

            /* ===== Q Logo Shine Effect ===== */



        .register-card h1{

    text-align:center;

    font-size:26px;

    font-weight:700;

    color:#0f172a;

    margin-bottom:8px;

}

        .subtitle{
             text-align:center;
             color:#64748b;
             margin-bottom:14px;
             font-size:15px;
        }

       .input-group {
            margin-bottom: 10px;
        }

        form{
             margin:0;
    }

        .input-group label{

    display:block;

    font-size:14px;

    font-weight:600;

    margin-bottom:8px;

    color:#334155;

}


        .input-group input{

    width:100%;

    height:52px;

    border:none;
    outline:none;

    padding:0 18px;

    border-radius:18px;

    background:white;

    border:2px solid transparent;

    transition:.3s;

    box-shadow:
        0 8px 20px rgba(15,23,42,.04);

    font-size:15px;

    color:#0f172a;

}

.input-group input::placeholder{

    color:#94a3b8;

}

.input-group input:hover{

    transform:translateY(-2px);

}

.input-group input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 5px rgba(37,99,235,.12);

    background:white;

}


        /* Password box with eye icon */
        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 48px;
        }

        .eye-button{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    cursor:pointer;

    font-size:18px;

    color:#64748b;

    padding:5px;

    transition:.25s;

}

.eye-button:hover{

    color:#2563eb;

    transform:
        translateY(-50%)
        scale(1.15);

}


        /* Password Strength */

.strength{
    width:100%;
    height:8px;
    background:#e5e7eb;
    border-radius:20px;
    margin-top:10px;
    overflow:hidden;
}

.strength-bar{
    width:0%;
    height:100%;
    background:#ef4444;
    transition:.3s;
}

.strength-text{
    margin-top:8px;
    font-size:14px;
    color:#64748b;
}


        .register-button{

    width:100%;

    height:52px;

    border:none;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6,
            #60a5fa
        );

    background-size:200%;

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 18px 35px rgba(37,99,235,.25);

}

.register-button:hover{

    background-position:right;

    transform:translateY(-3px);

}

.register-button:disabled{

    opacity:.75;

    cursor:not-allowed;

    transform:none;

}

        #message {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            min-height: 0;
        }

        .login-link {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }

        .login-link a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
    .register-card {
        width: calc(100% - 24px) !important;
        min-width: 0 !important;
        max-width: 430px !important;
        padding: 18px 20px;
    }
}

        /* ========================================
   EMAIL VERIFICATION
======================================== */

.email-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

/* Phone Number */
.phone-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.country-code{

    height:52px;

    padding:0 14px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:2px solid transparent;

    border-radius:18px;

    background:white;

    color:#334155;

    font-size:15px;

    font-weight:600;

    flex-shrink:0;

    box-shadow:
        0 8px 20px rgba(15,23,42,.04);

}

.phone-row input {
    flex: 1;
}

.email-row input {
    flex: 1;
}

.verify-email-button{

    height:52px;

    width:90px;

    padding:0 8px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6,
            #60a5fa
        );

    background-size:200%;

    color:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.35s;

    white-space:nowrap;

}

.verify-email-button:hover{

    background-position:right;

    transform:translateY(-3px);

}


.verify-email-button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}


/* ========================================
   OTP BOXES
======================================== */

.otp-container{

    display:flex;

    justify-content:center;

    gap:8px;

    margin:6px 0;

}

.register-otp{

    width:45px !important;

    height:45px !important;

    padding:0 !important;

    text-align:center;

    font-size:20px !important;

    font-weight:bold;

    border:2px solid transparent !important;

    border-radius:14px !important;

    background:white !important;

    box-shadow:
        0 8px 20px rgba(15,23,42,.04);

}

.register-otp:focus{

    border-color:#2563eb !important;

    box-shadow:
        0 0 0 4px rgba(37,99,235,.12) !important;

}


/* ========================================
   VERIFY OTP BUTTON
======================================== */

.verify-otp-button{

    width:100%;

    height:44px;

    margin-top:8px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6,
            #60a5fa
        );

    background-size:200%;

    color:white;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 12px 25px rgba(37,99,235,.18);

}

.verify-otp-button:hover{

    background-position:right;

    transform:translateY(-2px);

}

.verify-otp-button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}


/* ========================================
   EMAIL VERIFICATION MESSAGE
======================================== */

.email-verification-message {
    text-align: center;
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
}

/* FINAL REGISTER PAGE SPACING */

.register-card {
    padding-top: 18px;
    padding-bottom: 18px;
}


.subtitle {
    margin-bottom: 16px;
}

.input-group {
    margin-bottom: 14px;
}

.input-group label {
    margin-bottom: 7px;
}

.email-verification-message {
    margin-top: 8px;
    margin-bottom: 10px;
}

.otp-container {
    margin-top: 10px;
    margin-bottom: 10px;
    gap: 10px;
}

.verify-otp-button {
    margin-top: 6px;
    margin-bottom: 4px;
}

.strength {
    margin-top: 8px;
}

.strength-text {
    margin-top: 7px;
}

.login-link{

    text-align:center;

    margin-top:12px;

    color:#64748b;

    font-size:14px;

}

.login-link a{

    color:#2563eb;

    font-weight:700;

    text-decoration:none;

}

.login-link a:hover{

    text-decoration:underline;

}

/* ===== OTP OPEN STATE ===== */

.register-card.otp-active{

    padding-top:20px;

}


/* ==================================================
   REGISTER PAGE - LOGIN PAGE SIZE
   ================================================== */

}

   FINAL OTP COMPACT LAYOUT
========================================= */

    margin-bottom: 3px !important;

    display: block;
    margin-bottom: 0 !important;
}

.otp-label-row .email-verification-message {

    margin: 0 !important;

    font-size: 12px;

    font-weight: 600;

    white-space: nowrap;
}

    margin-bottom: 6px !important;

    margin-top: 2px !important;

.register-card.otp-active .strength-text {

/* FINAL REGISTER CARD FIX */
.register-card {
    width: 450px;
    max-width: calc(100vw - 30px);

/* Keep card fully visible on normal screen */

    body {
        overflow: hidden;
    }

    body {
        overflow-y: auto;
    }

        width: calc(100vw - 24px);

    }

</a>

<h1>Create Account</h1>

<p class="subtitle">
    Create your QueueLess account.
</p>


        <form id="registerForm">

            <!-- Full Name -->
            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- Email -->
<div class="input-group">

    <label for="email">
        Email Address
    </label>

    <div class="email-row">

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <button
        type="button"
        id="verifyEmailBtn"
        class="verify-email-button"
    >
        Verify
    </button>

</div>

<div
    id="emailAvailabilityMessage"
    class="email-verification-message"
></div>

</div>


<!-- Email OTP -->
<div
    class="input-group otp-section"
    id="emailOtpSection"
    style="display:none;"
>

    <div class="otp-label-row">
    <label>
        Enter Email OTP
    </label>

    <div
        id="emailVerificationMessage"
        class="email-verification-message"
    ></div>
</div>

    <div class="otp-container">

        <input
            type="text"
            class="register-otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            type="text"
            class="register-otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            type="text"
            class="register-otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            type="text"
            class="register-otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            type="text"
            class="register-otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            type="text"
            class="register-otp"
            maxlength="1"
            inputmode="numeric"
        >

    </div>

    <button
        type="button"
        id="verifyOtpBtn"
        class="verify-otp-button"
    >
        Verify OTP
    </button>

    </div>



<!-- Phone Number -->
<div class="input-group">

    <label for="phone">
        Phone Number
    </label>

    <div class="phone-row">

        <div class="country-code">
            +91
        </div>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            maxlength="10"
            pattern="[0-9]{10}"
            inputmode="numeric"
            required
        >

    </div>

</div>


            <!-- Password -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password"
                    >
    <i class="fas fa-eye"></i>
</button>


                </div>

                <div class="strength">
    <div id="strengthBar" class="strength-bar"></div>
</div>

<div id="strengthText" class="strength-text">
    Password Strength
</div>

            </div>


            <!-- Confirm Password -->
            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show confirm password"
                    >
    <i class="fas fa-eye"></i>
</button>


                </div>

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                class="register-button"
                id="registerButton"
            >
                Create Account
            </button>


            <div id="message"></div>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerButton =
            document.getElementById("registerButton");


        /*
         * SHOW / HIDE PASSWORD
         */
        
        function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    const icon = button.querySelector("i");

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }
}

        const passwordInput = document.getElementById("password");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

passwordInput.addEventListener("input", function () {

    const password = passwordInput.value;

    // Empty password
    if (password.length === 0) {

        strengthBar.style.width = "0%";
        strengthBar.style.background = "#e5e7eb";
        strengthText.innerHTML = "Password Strength";

        return;
    }

    // Very weak: less than 6 characters
    if (password.length < 6) {

        strengthBar.style.width = "25%";
        strengthBar.style.background = "#ef4444";
        strengthText.innerHTML = "Strength: Weak";

        return;
    }

    let score = 0;

    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    // Medium
    if (score === 0 || score === 1) {

        strengthBar.style.width = "50%";
        strengthBar.style.background = "#f59e0b";
        strengthText.innerHTML = "Strength: Medium";

    }

    // Good
    else if (score === 2 || score === 3) {

        strengthBar.style.width = "75%";
        strengthBar.style.background = "#3b82f6";
        strengthText.innerHTML = "Strength: Good";

    }

    // Strong
    else {

        strengthBar.style.width = "100%";
        strengthBar.style.background = "#22c55e";
        strengthText.innerHTML = "Strength: Strong";

    }

});

const phoneInput = document.getElementById("phone");

phoneInput.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 10);
});

// ========================================
// EMAIL OTP VERIFICATION
// ========================================

const verifyEmailBtn =
    document.getElementById("verifyEmailBtn");

const verifyOtpBtn =
    document.getElementById("verifyOtpBtn");

const emailOtpSection =
    document.getElementById("emailOtpSection");

const emailVerificationMessage =
    document.getElementById("emailVerificationMessage");

const emailAvailabilityMessage =
    document.getElementById("emailAvailabilityMessage");

const otpBoxes =
    document.querySelectorAll(".register-otp");

let emailVerified = false;
let verifiedEmail = "";


// ========================================
// SEND OTP
// ========================================

verifyEmailBtn.addEventListener(
    "click",
    async function () {

        
    const email =
    document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

        if (!email) {

            emailVerificationMessage.style.color =
                "red";

            emailVerificationMessage.textContent =
                "Please enter your email.";

            return;
        }


        const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

if (!emailPattern.test(email)) {

    emailVerificationMessage.style.color =
        "red";

    emailVerificationMessage.textContent =
        "Please enter a valid email address.";

    return;
}

        verifyEmailBtn.disabled = true;

        verifyEmailBtn.textContent =
            "Sending...";


        try {

            const response =
                await fetch(
                     "http://127.0.0.1:3000/api/send-register-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const data =
                await response.json();


            const serverMessage =
    String(data.message || "").toLowerCase();

const emailAlreadyExists =
    serverMessage.includes("already exists") ||
    serverMessage.includes("already registered") ||
    serverMessage.includes("email exists") ||
    serverMessage.includes("email is already");

if (response.ok && !emailAlreadyExists) {

    emailOtpSection.style.display = "block";

    document
        .querySelector(".register-card")
        .classList.add("otp-active");

    emailVerificationMessage.style.color = "#2563eb";

    emailVerificationMessage.textContent =
        "OTP sent to your email.";

    emailAvailabilityMessage.textContent = "";

    otpBoxes.forEach(function(box) {
        box.value = "";
    });

    otpBoxes[0].focus();

} else {

    emailOtpSection.style.display = "none";

    document
        .querySelector(".register-card")
        .classList.remove("otp-active");

    emailAvailabilityMessage.style.color = "red";

    emailAvailabilityMessage.textContent =
        data.message ||
        "An account already exists with this email.";

    verifyEmailBtn.disabled = false;

    verifyEmailBtn.textContent = "Verify";
}


        } catch (error) {

            console.error(error);

            emailAvailabilityMessage.style.color = "red";

emailAvailabilityMessage.textContent =
    "Cannot connect to backend.";


       verifyEmailBtn.disabled = false;

verifyEmailBtn.textContent =
    "Verify";

    }
}
);

// ========================================
// RESET VERIFICATION WHEN EMAIL CHANGES
// ========================================

document
    .getElementById("email")
    .addEventListener("input", function () {

        emailAvailabilityMessage.textContent = "";

        // Reset verification state
        emailVerified = false;
        verifiedEmail = "";

        // Hide OTP section
        emailOtpSection.style.display = "none";

        document
    .querySelector(".register-card")
    .classList.remove("otp-active");

        // Clear OTP boxes
        otpBoxes.forEach(function (box) {
            box.value = "";
        });

        // Reset Verify Email button
        verifyEmailBtn.disabled = false;
        verifyEmailBtn.textContent = "Verify";
        verifyEmailBtn.style.background = "";

        // Reset Verify OTP button
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = "Verify OTP";
        verifyOtpBtn.style.background = "";

        // Clear old verification message
        emailVerificationMessage.textContent = "";
        emailVerificationMessage.style.color = "";
    });


// ========================================
// OTP BOX INPUT
// ========================================

otpBoxes.forEach(
    function (box, index) {

        box.addEventListener(
            "input",
            function () {

                box.value =
                    box.value.replace(
                        /[^0-9]/g,
                        ""
                    );


                if (
                    box.value &&
                    index <
                        otpBoxes.length - 1
                ) {

                    otpBoxes[index + 1].focus();

                }

            }
        );


        box.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                        "Backspace" &&
                    !box.value &&
                    index > 0
                ) {

                    otpBoxes[index - 1].focus();

                }

            }
        );

    }
);


// ========================================
// VERIFY OTP
// ========================================

verifyOtpBtn.addEventListener(
    "click",
    async function () {

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const otp =
            Array.from(otpBoxes)
                .map(function (box) {
                    return box.value;
                })
                .join("");


        if (otp.length !== 6) {

            emailVerificationMessage.style.color =
                "red";

            emailVerificationMessage.textContent =
                "Please enter the 6-digit OTP.";

            return;
        }


        verifyOtpBtn.disabled = true;

        verifyOtpBtn.textContent =
            "Verifying...";


        try {

            const response =
                await fetch(
                     "http://127.0.0.1:3000/api/verify-register-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            otp: otp
                        })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

    emailVerified = true;

    verifiedEmail = email;

    // Hide OTP section after successful verification
    emailOtpSection.style.display = "none";

    document
    .querySelector(".register-card")
    .classList.remove("otp-active");


    emailVerificationMessage.style.color =
        "#16a34a";

    emailVerificationMessage.textContent =
        "✓ Email verified successfully";

    verifyEmailBtn.textContent =
        "✓ Verified";

    verifyEmailBtn.style.background =
        "#16a34a";

    verifyEmailBtn.disabled =
        true;

            } else {

                emailVerificationMessage.style.color =
                    "red";

                emailVerificationMessage.textContent =
                    data.message ||
                    "Invalid OTP.";

                verifyOtpBtn.disabled =
                    false;

                verifyOtpBtn.textContent =
                    "Verify OTP";

            }

        } catch (error) {

            console.error(error);

            emailVerificationMessage.style.color =
                "red";

            emailVerificationMessage.textContent =
                "Cannot connect to backend.";

            verifyOtpBtn.disabled =
                false;

            verifyOtpBtn.textContent =
                "Verify OTP";

        }

    }
);


        /*
         * REGISTER USER
         */
        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;

                const phone =
    document
        .getElementById("phone")
        .value
        .trim();



                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                /*
                 * Check empty fields
                 */
                if (
                    !name ||
                    !email ||
                    !phone ||
                    !password ||
                    !confirmPassword
                ) {

                    message.style.color = "red";

                    message.textContent =
                        "Please fill all fields.";

                    return;
                }

                // ========================================
// CHECK EMAIL VERIFICATION
// ========================================

if (
    !emailVerified ||
    verifiedEmail !== email.toLowerCase()
) {

    message.style.color = "red";

    message.textContent =
        "Please verify your email first.";

    return;
}



                /*
                 * Minimum password length
                 */
                if (password.length < 6) {

                    message.style.color = "red";

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    return;
                }


                /*
                 * Check both passwords
                 */
                if (password !== confirmPassword) {

                    message.style.color = "red";

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                /*
                 * Loading
                 */
                message.style.color = "#333";

                message.textContent =
                    "Creating account...";


                registerButton.disabled = true;

                registerButton.textContent =
                    "Please wait...";


                /*
                 * Stop request after 15 seconds
                 */
                const controller =
                    new AbortController();


                const timeout =
                    setTimeout(function () {

                        controller.abort();

                    }, 15000);


                try {

                    console.log(
                        "Sending registration request..."
                    );


                    /*
                     * Send registration to backend
                     */
                    const response =
                        await fetch(
                             "http://127.0.0.1:3000/api/register",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                     name: name,
                                     email: email,
                                     phone: phone,
                                     password: password
                                     }),

                                signal:
                                    controller.signal
                            }
                        );


                    clearTimeout(timeout);


                    console.log(
                        "Server status:",
                        response.status
                    );


                    const data =
                        await response.json();


                    console.log(
                        "Server response:",
                        data
                    );


                    /*
                     * Registration successful
                     */
                    if (response.ok) {

                        message.style.color =
                            "green";


                        message.textContent =
                            data.message ||
                            "Account created successfully!";


                        registerForm.reset();


                        /*
                         * Go to Login page
                         */
                        setTimeout(
                            function () {

                                window.location.href =
                                    "login.html";

                            },
                            1500
                        );

                    }

                    /*
                     * Server error
                     */
                    else {

                        message.style.color =
                            "red";


                        message.textContent =
                            data.message ||
                            "Registration failed.";

                    }

                }

                catch (error) {

                    clearTimeout(timeout);


                    console.error(
                        "Registration error:",
                        error
                    );


                    message.style.color =
                        "red";


                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        message.textContent =
                            "Server took too long to respond.";

                    }

                    else {

                        message.textContent =
                            "Cannot connect to backend server.";

                    }

                }

                finally {

                    registerButton.disabled =
                        false;


                    registerButton.textContent =
                        "Create Account";

                }

            }
        );

    </script>

</body>

</html>
