<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP | QueueLess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

margin:0;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:linear-gradient(135deg,#ffffff 0%,#eef3ff 45%,#dfe9ff 100%);

font-family:'Poppins',sans-serif;

padding:0;

}


.background{

position:absolute;
inset:0;
overflow:hidden;

pointer-events:none;
z-index:0;

}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(4px);
    animation:float 12s ease-in-out infinite;
}

.circle:nth-child(1){
    width:320px;
    height:320px;
    background:#3b82f630;
    top:-120px;
    left:-100px;
}

.circle:nth-child(2){
    width:250px;
    height:250px;
    background:#60a5fa30;
    right:-80px;
    top:80px;
    animation-duration:15s;
}

.circle:nth-child(3){
    width:220px;
    height:220px;
    background:#2563eb20;
    bottom:-80px;
    left:15%;
    animation-duration:18s;
}

.circle:nth-child(4){
    width:180px;
    height:180px;
    background:#93c5fd30;
    bottom:70px;
    right:8%;
    animation-duration:20s;
}

.circle:nth-child(5){
    display:none;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-35px);
    }

    100%{
        transform:translateY(0px);
    }
}
.container{

width:100%;
max-width:520px;

display:flex;
justify-content:center;
align-items:center;

margin:auto;

position:relative;
z-index:10;

}

.card{

    width:100%;
    max-width:450px;

    padding:28px 30px;

    background:#fff;

    border-radius:28px;

    box-shadow:
        0 35px 90px rgba(79,70,229,.18),
        0 15px 35px rgba(0,0,0,.08);

    position:relative;
    z-index:20;

}

@keyframes cardUp{

from{
opacity:0;
transform:translateY(35px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin-bottom:10px;
}

.logo-text{
    text-align:left;
}


.logo-icon{
    width:58px;
    height:58px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #6366f1,
        #4f46e5
    );

    color:white;

    font-size:30px;
    font-weight:800;

    position:relative;
    overflow:hidden;

    box-shadow:
    0 15px 35px rgba(79,70,229,.35);
}

.logo-icon::before{
    content:"";

    position:absolute;

    top:-40%;
    left:-80%;

    width:60%;
    height:180%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);

    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{
        left:-80%;
    }

    100%{
        left:160%;
    }
}


.logo-text h2{
    font-size:32px;
    color:#111827;
}

.logo-text h2 span{
    color:#4f46e5;
}

.logo-text p{

font-size:13px;
color:#64748b;

}



.title{

text-align:center;
font-size:30px;
font-weight:700;
color:#111827;
margin-bottom:10px;

}

.subtitle{

text-align:center;
font-size:14px;
line-height:1.7;
color:#64748b;
margin-bottom:18px;

}


.otp-info {

    text-align: center;

    background: #f8fafc;

    border: 1px solid #dbeafe;

    border-radius: 14px;

    padding: 14px;

    margin-bottom: 22px;

    color: #64748b;

    font-size: 14px;

}

.email {

    color: #2563eb;

    font-weight: 700;

    word-break: break-all;

}


.otp-container {

    display: flex;

    justify-content: center;

    gap: 10px;

    margin-bottom: 18px;

}

.otp-box {

    width: 52px;
    height: 58px;

    border: 2px solid #e2e8f0;

    border-radius: 14px;

    background: white;

    text-align: center;

    font-size: 22px;

    font-weight: 700;

    color: #0f172a;

    outline: none;

    transition: .25s;

}

.otp-box:focus{

    border-color:#4f46e5;

    box-shadow:
    0 0 0 4px rgba(79,70,229,.12);

}


button {

    width: 100%;

    height: 58px;

    border: none;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6,
            #60a5fa
        );

    background-size: 200%;

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition: .35s;

    box-shadow:
        0 18px 35px rgba(37,99,235,.25);

}

button:hover {

    background-position: right;

    transform: translateY(-3px);

}

button:disabled {

    opacity: .75;

    cursor: not-allowed;

    transform: none;

}

button i{

margin-right:8px;

}

.message{

margin-top:18px;

text-align:center;

font-size:14px;

font-weight:500;

min-height:22px;

}

.resend {

    display: block;

    width: max-content;

    margin: 14px auto 0;

    padding: 8px 18px;

    text-align: center;

    font-size: 14px;

    font-weight: 700;

    color: #2563eb;

    background: #eff6ff;

    border-radius: 10px;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        color 0.2s ease;

}

.resend:hover {

    color: #1d4ed8;

    background: #dbeafe;

    box-shadow: 0 4px 12px rgba(37,99,235,.15);

    transform: translateY(-1px);

}

.resend:active {

    transform: scale(.94);

    background: #bfdbfe;

}

.resend.loading {

    pointer-events: none;

    opacity: .65;

    cursor: wait;

}

.back{

margin-top:16px;

text-align:center;

}

.back a{

text-decoration:none;

font-weight:600;

color:#64748b;

}

.back a:hover{

color:#312e81;

}

.login-footer{

    margin-top:18px;

    text-align:center;

    font-size:14px;

    color:#7c8aa5;

}

.login-footer i{

    color:#5b5bf6;

    margin-right:6px;

}

@media(max-width:600px){

.container{

padding:18px;

}

.card{

padding:34px 24px;

}

.logo{

flex-direction:column;

gap:10px;

}

.logo-text{

text-align:center;

}

.logo-text h2{

font-size:26px;

}

.otp-box{

width:48px;
height:54px;

}

}

</style>

</head>

<body>

<div class="background">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

</div>

<div class="container">

<div class="card">

<div class="logo">

<div class="logo-icon">
Q
</div>

<div class="logo-text">

<h2>Queue<span>Less</span></h2>

<p>Smart Queue Management</p>

</div>

</div>

<h1 class="title">

    Verify OTP

</h1>

<p class="subtitle">
    Enter the verification code to continue.
</p>

<div class="otp-info">

    A 6-digit OTP has been sent to your email.

    <br>

    <span class="email" id="userEmail">
    </span>

</div>

<div class="otp-container">

<input class="otp-box" maxlength="1">
<input class="otp-box" maxlength="1">
<input class="otp-box" maxlength="1">
<input class="otp-box" maxlength="1">
<input class="otp-box" maxlength="1">
<input class="otp-box" maxlength="1">

</div>


<div
    id="message"
    class="message">
</div>

<button id="verifyBtn">

    <i class="fa-solid fa-circle-check"></i>

    Verify OTP

</button>

<div
    id="otpTimer"
    style="
        text-align:center;
        margin-top:12px;
        font-size:13px;
        font-weight:600;
        color:#64748b;
    ">

    OTP expires in <span id="timer">05:00</span>

</div>

<div
    class="resend"
    id="resendLink">

    Resend OTP

</div>

<div class="back">

<a href="login.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</div>

<p class="login-footer">

    <i class="fas fa-shield-halved"></i>

    Secure Queue Management System

</p>

</div>

</div>
<script>

const email = sessionStorage.getItem("resetEmail") || "";

document.getElementById("userEmail").textContent = email;

const otpBoxes = document.querySelectorAll(".otp-box");
const verifyBtn = document.getElementById("verifyBtn");
const message = document.getElementById("message");
const resendLink = document.getElementById("resendLink");
const timer = document.getElementById("timer");

/* -------------------------
   OTP Auto Focus
------------------------- */

otpBoxes.forEach((box,index)=>{

box.addEventListener("input",e=>{

box.value = box.value.replace(/[^0-9]/g,"");

if(box.value && index<otpBoxes.length-1){

otpBoxes[index+1].focus();

}

});

box.addEventListener("keydown",e=>{

if(e.key==="Backspace" && !box.value && index>0){

otpBoxes[index-1].focus();

}

});

});

/* -------------------------
   Paste OTP
------------------------- */

document.addEventListener("paste",e=>{

const paste=(e.clipboardData||window.clipboardData)
.getData("text")
.replace(/\D/g,"")
.substring(0,6);

if(paste.length===6){

otpBoxes.forEach((box,i)=>{

box.value=paste[i];

});

otpBoxes[5].focus();

}

});

/* -------------------------
   Show Message
------------------------- */

function showMessage(text,color){

message.innerHTML=text;
message.style.color=color;

}

/* -------------------------
   Verify OTP
------------------------- */

verifyBtn.onclick=async()=>{

if (otpExpired) {

    showMessage(
        "OTP has expired. Please resend a new OTP.",
        "#ef4444"
    );

    return;
}

const otp=[...otpBoxes]
.map(box=>box.value)
.join("");

if(otp.length!==6){

showMessage(
"Please enter a valid 6-digit OTP.",
"#ef4444"
);

return;

}

verifyBtn.disabled=true;

verifyBtn.innerHTML=
'<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

try{

const response=await fetch(

  "https://queue-less-one.vercel.app/api/verify-otp",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
otp

})

}

);

const data=await response.json();

if(response.ok){

showMessage(

data.message || "OTP Verified!",

"#22c55e"

);

setTimeout(()=>{

window.location.replace("reset-password.html");

},1000);

}else{

showMessage(

data.message || "Invalid OTP.",

"#ef4444"

);

}

}catch(error){

showMessage(

"Unable to connect to server.",

"#ef4444"

);

}

verifyBtn.disabled=false;

verifyBtn.innerHTML=
'<i class="fa-solid fa-circle-check"></i> Verify OTP';

};

/* -------------------------
   Resend Timer
------------------------- */

let seconds = 300;
let otpExpired = false;

function startResendTimer() {

    clearInterval(window.resendCountdown);

    resendLink.style.pointerEvents = "auto";
    resendLink.style.opacity = "1";

    function updateResendTimer() {

        const minutes =
            Math.floor(seconds / 60);

        const remainingSeconds =
            seconds % 60;

        timer.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(remainingSeconds).padStart(2, "0");

        if (seconds <= 0) {

    clearInterval(window.resendCountdown);

    otpExpired = true;

    verifyBtn.disabled = true;

    resendLink.style.pointerEvents = "auto";
    resendLink.style.opacity = "1";

    resendLink.textContent =
        "Resend OTP";

    timer.textContent = "Expired";

    // Show expired message
    message.style.color = "#ef4444";
    message.textContent =
        "OTP expired. Please resend a new OTP.";

    return;
}

        seconds--;
    }

    updateResendTimer();

    window.resendCountdown =
        setInterval(updateResendTimer, 1000);
}

startResendTimer();

resendLink.onclick=async(e)=>{

    e.preventDefault();

    try{

const response=await fetch(

"https://queue-less-one.vercel.app/api/forgot-password",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email

})

}

);

const data=await response.json();

if(response.ok){

    showMessage(
        "A new OTP has been sent to your email.",
        "#22c55e"
    );

    // Clear old OTP
    otpBoxes.forEach(function(box) {
        box.value = "";
    });

    // Focus first box
    otpBoxes[0].focus();

    // Restart 5-minute timer
    seconds = 300;
    otpExpired = false;
    verifyBtn.disabled = false;

    startResendTimer();

    // Show success on resend button
    resendLink.classList.remove("loading");
    resendLink.textContent = "✓ OTP Resent";

    setTimeout(function() {
        resendLink.textContent = "Resend OTP";
    }, 2000);

}else{

showMessage(

data.message,

"#ef4444"

);

}

}catch(error){

showMessage(

"Unable to resend OTP.",

"#ef4444"

);

}

};

</script>

</body>

</html>
