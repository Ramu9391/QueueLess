<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | QueueLess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

margin:0;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
linear-gradient(
135deg,
#ffffff 0%,
#eef2ff 35%,
#dbeafe 100%);

position:relative;

}

/* Animated Background */

.background{

position:absolute;
inset:0;
overflow:hidden;

}


.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(4px);
    animation:float 12s ease-in-out infinite;
}

.circle:nth-child(1){
    width:320px;
    height:320px;
    background:#3b82f630;
    top:-120px;
    left:-100px;
}

.circle:nth-child(2){
    width:250px;
    height:250px;
    background:#60a5fa30;
    right:-80px;
    top:80px;
    animation-duration:15s;
}

.circle:nth-child(3){
    width:220px;
    height:220px;
    background:#2563eb20;
    bottom:-80px;
    left:15%;
    animation-duration:18s;
}

.circle:nth-child(4){
    width:180px;
    height:180px;
    background:#93c5fd30;
    bottom:70px;
    right:8%;
    animation-duration:20s;
}

.circle:nth-child(5){
    display:none;
}


@keyframes float{

0%,100%{

transform:translateY(0) rotate(0);

}

50%{

transform:translateY(-35px) rotate(180deg);

}

}

/* Container */

.container{

width:100%;
max-width:470px;

display:flex;
justify-content:center;
align-items:center;

padding:12px 18px;

position:relative;
z-index:2;

}

/* Card */

.card{

background:rgba(255,255,255,.96);

width:100%;
max-width:450px;


border-radius:28px;

padding:24px 30px;

border:1px solid rgba(255,255,255,.75);

box-shadow:

0 30px 80px rgba(99,102,241,.16),

0 12px 35px rgba(0,0,0,.08);

animation:cardUp .8s ease;

transition:.35s;

}

.card:hover{

transform:translateY(-6px);

box-shadow:

0 40px 90px rgba(99,102,241,.22),

0 20px 40px rgba(0,0,0,.10);

}

@keyframes cardUp{

from{

opacity:0;
transform:translateY(35px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* Logo */

.logo{

display:flex;
justify-content:center;
align-items:center;
gap:14px;
margin-bottom:12px;

}

.logo-icon{
    width:60px;
    height:60px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #6366f1,
        #4f46e5);

    color:#fff;

    font-size:28px;
    font-weight:700;

    position:relative;
    overflow:hidden;

    box-shadow:
    0 15px 35px rgba(79,70,229,.35);
}

.logo-icon::before{
    content:"";

    position:absolute;

    top:-40%;
    left:-80%;

    width:60%;
    height:180%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);

    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{
        left:-80%;
    }

    100%{
        left:160%;
    }
}

.logo-text h2{
    font-size:32px;
    color:#111827;
}

.logo-text h2 span{
    color:#4f46e5;
}

.logo-text p{
    font-size:13px;
    color:#64748b;
}



/* Lock Icon */

.lock{

width:80px;
height:80px;

margin:auto;
margin-bottom:12px;

display:flex;
justify-content:center;
align-items:center;

border-radius:50%;

background:#eef2ff;

color:#4f46e5;

font-size:36px;

box-shadow:
0 10px 30px rgba(79,70,229,.18);

animation:pulse 2.2s infinite;

}

@keyframes pulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.07);

}

}

.title{

text-align:center;

font-size:28px;
font-weight:700;

color:#111827;

margin-bottom:8px;

}

.subtitle{

text-align:center;

font-size:14px;

line-height:1.7;

color:#64748b;

margin-bottom:16px;

}
.input-group{

position:relative;
margin-bottom:16px;

}

.input-group i:first-child{

position:absolute;

left:18px;
top:50%;

transform:translateY(-50%);

color:#6366f1;

font-size:17px;

}

.input-group input{

width:100%;
height:60px;

padding:0 55px 0 50px;

border:1px solid #dbe3f0;

border-radius:16px;

outline:none;

font-size:15px;

background:#fff;

transition:.3s;

}

.input-group input:focus{

border-color:#4f46e5;

box-shadow:
0 0 0 4px rgba(79,70,229,.12);

}

.toggle-password{

position:absolute;

right:18px;
top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#64748b;

font-size:18px;

transition:.3s;

}

.toggle-password:hover{

color:#4f46e5;

}

/* Password Strength */

.strength{

height:8px;

background:#e5e7eb;

border-radius:10px;

overflow:hidden;

margin:8px 0 10px;

}

.strength-bar{

height:100%;

width:0%;

background:#ef4444;

transition:.4s;

}

.strength-text{

font-size:13px;

color:#64748b;

margin-top:-2px;

margin-bottom:14px;

}

/* Button */

button{

width:100%;

height:60px;

border:none;

border-radius:16px;

cursor:pointer;

font-size:16px;

font-weight:600;

color:#fff;

background:
linear-gradient(
135deg,
#6366f1,
#4f46e5);

box-shadow:
0 15px 30px rgba(79,70,229,.30);

transition:.35s;

}

button:hover{

transform:translateY(-4px);

box-shadow:
0 20px 40px rgba(79,70,229,.35);

}

.message{

margin-top:18px;

text-align:center;

font-size:14px;

font-weight:500;

min-height:20px;

}

.back{

margin-top:12px;

text-align:center;

}

.back a{

text-decoration:none;

font-weight:600;

color:#4f46e5;

}

.back a:hover{

color:#312e81;

}

@media(max-width:600px){

.card{

padding:24px 32px;

}

.logo{

flex-direction:column;

}

.logo-text{

text-align:center;

}

.logo-text h2{

font-size:26px;

}

.title{

font-size:26px;

}

}

</style>

</head>

<body>

<div class="background">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

</div>

<div class="container">

<div class="card">

<div class="logo">

<div class="logo-icon">

Q

</div>

<div class="logo-text">

<h2>Queue<span>Less</span></h2>

<p>Smart Queue Management</p>

</div>

</div>

<div class="lock">

<i class="fa-solid fa-lock"></i>

</div>

<h1 class="title">

Reset Password

</h1>

<p class="subtitle">

Create a strong new password for your QueueLess account.

</p>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="New Password">

<i
class="fa-solid fa-eye toggle-password"
id="togglePassword">
</i>

</div>

<div class="strength">

<div
id="strengthBar"
class="strength-bar">
</div>

</div>

<div
id="strengthText"
class="strength-text">

Password Strength

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<i
class="fa-solid fa-eye toggle-password"
id="toggleConfirm">
</i>

</div>

<button id="resetBtn">

<i class="fa-solid fa-key"></i>

Reset Password

</button>

<div
id="message"
class="message">
</div>

<div class="back">

<a href="login.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</div>

</div>

</div>

<script>

const email = sessionStorage.getItem("resetEmail");

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");

const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

const togglePassword = document.getElementById("togglePassword");
const toggleConfirm = document.getElementById("toggleConfirm");

/* =========================
   Show / Hide Password
========================= */

function toggle(input, icon){

if(input.type==="password"){

input.type="text";
icon.classList.replace("fa-eye","fa-eye-slash");

}else{

input.type="password";
icon.classList.replace("fa-eye-slash","fa-eye");

}

}

togglePassword.onclick=()=>toggle(password,togglePassword);
toggleConfirm.onclick=()=>toggle(confirmPassword,toggleConfirm);

/* =========================
   Password Strength
========================= */

password.addEventListener("input", () => {

    const value = password.value;

    // Reset when password is empty
    if (value.length === 0) {

        strengthBar.style.width = "0%";
        strengthBar.style.background = "#e5e7eb";
        strengthText.innerHTML = "Password Strength";

        return;
    }

    let score = 0;

    if (value.length >= 6) score++;
    if (/[A-Z]/.test(value)) score++;
    if (/[0-9]/.test(value)) score++;
    if (/[!@#$%^&*]/.test(value)) score++;

    switch (score) {

        case 1:
            strengthBar.style.width = "25%";
            strengthBar.style.background = "#ef4444";
            strengthText.innerHTML = "Strength: Weak";
            break;

        case 2:
            strengthBar.style.width = "50%";
            strengthBar.style.background = "#f59e0b";
            strengthText.innerHTML = "Strength: Medium";
            break;

        case 3:
            strengthBar.style.width = "75%";
            strengthBar.style.background = "#3b82f6";
            strengthText.innerHTML = "Strength: Good";
            break;

        case 4:
            strengthBar.style.width = "100%";
            strengthBar.style.background = "#22c55e";
            strengthText.innerHTML = "Strength: Strong";
            break;

        default:
            strengthBar.style.width = "25%";
            strengthBar.style.background = "#ef4444";
            strengthText.innerHTML = "Strength: Weak";
    }

});


/* =========================
   Show Message
========================= */

function showMessage(text,color){

message.innerHTML=text;
message.style.color=color;

}

/* =========================
   Reset Password
========================= */

resetBtn.onclick=async()=>{

if(password.value.length<6){

showMessage(
"Password must be at least 6 characters.",
"#ef4444"
);

return;

}

if(password.value!==confirmPassword.value){

showMessage(
"Passwords do not match.",
"#ef4444"
);

return;

}

resetBtn.disabled=true;

resetBtn.innerHTML=
'<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

try{

const response=await fetch(

"http://127.0.0.1:3000/api/reset-password",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password:password.value

})

}

);

const data=await response.json();

if(response.ok){

showMessage(

data.message || "Password reset successfully!",

"#22c55e"

);

sessionStorage.removeItem("resetEmail");

setTimeout(()=>{

window.location.replace("login.html");

},1500);

}else{

showMessage(

data.message || "Failed to reset password.",

"#ef4444"

);

}

}catch(error){

console.error(error);

showMessage(

"Unable to connect to server.",

"#ef4444"

);

}

finally{

resetBtn.disabled=false;

resetBtn.innerHTML=
'<i class="fa-solid fa-key"></i> Reset Password';

}

};

</script>

</body>

</html>
