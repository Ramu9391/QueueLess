<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Verification | QueueLess</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;

    background: linear-gradient(
        135deg,
        #ffffff 0%,
        #eef2ff 40%,
        #dbeafe 100%
    );

    position: relative;
}

/* =============================
   FLOATING BACKGROUND
============================= */

.bg-circle {
    position: absolute;
    border-radius: 50%;
    filter: blur(4px);
    animation: float 12s ease-in-out infinite;
    z-index: 0;
}

.bg1 {
    width: 320px;
    height: 320px;
    background: #3b82f630;
    top: -120px;
    left: -100px;
}

.bg2 {
    width: 250px;
    height: 250px;
    background: #60a5fa30;
    right: -80px;
    top: 80px;
    animation-duration: 15s;
}

.bg3 {
    width: 220px;
    height: 220px;
    background: #2563eb20;
    bottom: -80px;
    left: 15%;
    animation-duration: 18s;
}

.bg4 {
    width: 180px;
    height: 180px;
    background: #93c5fd30;
    bottom: 70px;
    right: 8%;
    animation-duration: 20s;
}

@keyframes float {
    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-35px);
    }

    100% {
        transform: translateY(0px);
    }
}


        .captcha-card {
    width: 100%;
    max-width: 520px;

    background: rgba(255,255,255,.96);

    border-radius: 24px;

    padding: 22px 30px;

    box-shadow:
        0 30px 80px rgba(79,70,229,.18),
        0 10px 30px rgba(0,0,0,.08);

    position: relative;
    z-index: 10;
}


        .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
    text-decoration: none;
}

.logo-box {
    width: 58px;
    height: 58px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #6d5efc,
        #4f46e5
    );

    color: white;
    font-size: 30px;
    font-weight: 800;

    box-shadow:
        0 18px 45px rgba(91,78,245,.35),
        0 0 35px rgba(91,78,245,.20);

    position: relative;
    overflow: hidden;
}

.logo-box::before {
    content: "";

    position: absolute;

    top: -40%;
    left: -80%;

    width: 55%;
    height: 180%;

    background: rgba(255,255,255,.40);

    transform: rotate(25deg);

    animation: shine 6s linear infinite;
}

.logo-text h1 {
    font-size: 32px;
    font-weight: 800;
    color: #111827;
    margin: 0;
}

.logo-text h1 span {
    color: #4f46e5;
}

.logo-text p {
    margin-top: 4px;
    font-size: 13px;
    color: #64748b;
}

@keyframes shine {
    0% {
        left: -80%;
    }

    100% {
        left: 160%;
    }
}
        .logo h1 {
            font-size: 30px;
            font-weight: 800;
            color: #111827;
        }

        .logo span {
            color: #4f46e5;
        }

        .logo p {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }

        .security-title {
            text-align: center;
            margin-bottom: 14px;
        }

        .security-title h2 {
            font-size: 21px;
            color: #0f172a;
        }

        .security-title p {
            font-size: 13px;
            color: #64748b;
            margin-top: 5px;
        }

        .captcha-title {
            background: #2563eb;
            color: white;

            padding: 15px;

            border-radius: 12px 12px 0 0;

            font-size: 14px;
            font-weight: 600;
        }

        .captcha-title strong {
            display: block;
            font-size: 18px;
            margin-top: 2px;
        }

        .captcha-images {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 4px;

            background: white;

            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .captcha-image {
            height: 82px;

            cursor: pointer;

            overflow: hidden;

            border: 3px solid transparent;

            transition: .2s;
        }

        .captcha-image:hover {
            opacity: .9;
        }

        .captcha-image.selected {
    border: 4px solid #2563eb;
    box-shadow: 0 0 0 2px white inset;
    transform: scale(0.97);
    position: relative;
}

/* Selected checkmark */
.captcha-image.selected::after {
    content: "✓";

    position: absolute;
    top: 5px;
    right: 5px;

    width: 18px;
    height: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #4285f4;
    color: white;

    border-radius: 50%;

    font-size: 14px;
    font-weight: 700;

    line-height: 1;

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);

    z-index: 10;
}



        .captcha-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .captcha-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 15px;
        }

        .refresh {
            border: none;
            background: transparent;

            font-size: 25px;

            cursor: pointer;

            color: #334155;
        }

        .verify {
            border: none;

            padding: 12px 28px;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .verify:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;

            min-height: 22px;

            margin-top: 12px;

            font-size: 13px;
            font-weight: 600;
        }

    </style>
</head>

<body>

    <!-- Floating Background -->
<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>
<div class="bg-circle bg3"></div>
<div class="bg-circle bg4"></div>

<div class="captcha-card">

    <a href="index.html" class="logo">
    <div class="logo-box">
        Q
    </div>

    <div class="logo-text">
        <h1>Queue<span>Less</span></h1>
        <p>Smart Queue Management</p>
    </div>
</a>


    <div class="security-title">
        <h2>Security Verification</h2>
        <p>Please complete the verification to continue.</p>
    </div>

    <div class="captcha-title">
        Select all images containing
        <strong id="question">Loading...</strong>
    </div>

    <div
        id="captchaImages"
        class="captcha-images">
    </div>

    <div class="captcha-bottom">

        <button
            class="refresh"
            onclick="loadCaptcha()">
            ↻
        </button>

        <button
            id="verifyButton"
            class="verify"
            onclick="verifyCaptcha()">
            Verify
        </button>

    </div>

    <div id="message"></div>

</div>

<script>

let captchaId = null;

let selectedIndexes = [];


/* ==========================
   LOAD CAPTCHA
========================== */

async function loadCaptcha() {

    captchaId = null;

    selectedIndexes = [];

    document.getElementById("question").textContent =
        "Loading...";

    document.getElementById("captchaImages").innerHTML =
        "Loading...";

    document.getElementById("message").textContent = "";

    try {

        const response = await fetch(
            "https://queue-less-one.vercel.app/api/captcha"
        );

        const data = await response.json();

        captchaId = data.captchaId;

        document.getElementById("question")
            .textContent =
            data.question
                .replace("Select all images containing ", "");

        const container =
            document.getElementById("captchaImages");

        container.innerHTML = "";

        data.images.forEach(function(item) {

            const box =
                document.createElement("div");

            box.className = "captcha-image";

            box.dataset.index = item.index;

            const image =
                document.createElement("img");

            image.src =
                "https://queue-less-one.vercel.app" +
                item.image;

            box.appendChild(image);

            box.addEventListener(
                "click",
                function() {

                    const index =
                        Number(box.dataset.index);

                    if (
                        selectedIndexes.includes(index)
                    ) {

                        selectedIndexes =
                            selectedIndexes.filter(
                                i => i !== index
                            );

                        box.classList.remove(
                            "selected"
                        );

                    } else {

                        selectedIndexes.push(index);

                        box.classList.add(
                            "selected"
                        );
                    }

                }
            );

            container.appendChild(box);

        });

    } catch(error) {

        console.error(error);

        document.getElementById("message")
            .style.color = "red";

        document.getElementById("message")
            .textContent =
            "Cannot connect to CAPTCHA server.";
    }
}


/* ==========================
   VERIFY
========================== */

async function verifyCaptcha() {

    if (!captchaId) {

        return;
    }

    if (selectedIndexes.length === 0) {

        document.getElementById("message")
            .style.color = "red";

        document.getElementById("message")
            .textContent =
            "Select the correct images.";

        return;
    }

    const button =
        document.getElementById("verifyButton");

    button.disabled = true;

    button.textContent = "Checking...";

    try {

        const response = await fetch(
            "https://queue-less-one.vercel.app/api/verify-captcha",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    captchaId: captchaId,

                    selectedIndexes:
                        selectedIndexes

                })
            }
        );

        const data =
            await response.json();

        if (response.ok) {

            document.getElementById("message")
                .style.color = "green";

            document.getElementById("message")
                .textContent =
                "✓ Verification successful";

            button.textContent =
                "Verified ✓";

            /*
             * Tell login page CAPTCHA is complete
             */

            if (window.opener) {

                window.opener.postMessage(
                    {
                        type: "CAPTCHA_VERIFIED",
                        captchaId: captchaId
                    },
                    "*"
                );

                setTimeout(function() {

                    window.close();

                }, 800);
            }

        } else {

            document.getElementById("message")
                .style.color = "red";

            document.getElementById("message")
                .textContent =
                data.message ||
                "Incorrect CAPTCHA.";

            button.disabled = false;

            button.textContent = "Verify";

            selectedIndexes = [];

            loadCaptcha();
        }

    } catch(error) {

        console.error(error);

        document.getElementById("message")
            .style.color = "red";

        document.getElementById("message")
            .textContent =
            "Cannot connect to CAPTCHA server.";

        button.disabled = false;

        button.textContent = "Verify";
    }
}


loadCaptcha();

</script>

</body>
</html>
